<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Aro Terminal</title>
<link rel="stylesheet" href="xterm.css">
<style>
@font-face {
  font-family: 'JetBrainsMono';
  src: url('JetBrainsMono-Regular.woff2') format('woff2');
  font-weight: normal;
  font-style: normal;
  font-display: swap;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%;
  background: #0d1117;
  overflow: hidden;
  touch-action: pan-y;
  -webkit-user-select: none;
  user-select: none;
}
#terminal {
  width: 100%; height: 100%;
  touch-action: pan-y;
}
/* Override xterm default font with JetBrains Mono and enable smooth touch scrolling */
.xterm .xterm-viewport {
  overflow-y: auto !important;
  touch-action: pan-y !important;
  -webkit-overflow-scrolling: touch !important;
}
.xterm-screen canvas { image-rendering: pixelated; }
</style>
</head>
<body>
<div id="terminal"></div>
<script src="xterm.js"></script>
<script src="xterm-addon-fit.js"></script>
<script>
'use strict';

// ─── Android bridge ──────────────────────────────────────────────────────────
// AroTerminal is injected by Kotlin via addJavascriptInterface
// AroTerminal.sendInput(str)  → send bytes to PTY
// AroTerminal.onReady(rows, cols) → terminal is ready, start PTY
// AroTerminal.onResize(rows, cols) → window resized

// ─── Terminal init (Compact Termux-style font size 11 & smooth scroll) ────────
const term = new Terminal({
  allowProposedApi: true,
  fontFamily: "'JetBrainsMono', 'Droid Sans Mono', 'DejaVu Sans Mono', monospace",
  fontSize: 11,
  lineHeight: 1.15,
  letterSpacing: 0,
  theme: {
    background:   '#0d1117',
    foreground:   '#c9d1d9',
    cursor:       '#58a6ff',
    cursorAccent: '#0d1117',
    black:        '#21262d',
    red:          '#f85149',
    green:        '#3fb950',
    yellow:       '#d29922',
    blue:         '#58a6ff',
    magenta:      '#bc8cff',
    cyan:         '#39c5cf',
    white:        '#b1bac4',
    brightBlack:  '#6e7681',
    brightRed:    '#ff7b72',
    brightGreen:  '#56d364',
    brightYellow: '#e3b341',
    brightBlue:   '#79c0ff',
    brightMagenta:'#d2a8ff',
    brightCyan:   '#56d4dd',
    brightWhite:  '#f0f6fc',
    selectionBackground: '#264f78',
  },
  cursorBlink: true,
  cursorStyle: 'block',
  scrollback: 10000,
  smoothScrollDuration: 100,
  scrollSensitivity: 2,
  fastScrollSensitivity: 4,
  convertEol: false,
  bellStyle: 'none',
  allowTransparency: false,
  disableStdin: false,
  drawBoldTextInBrightColors: true,
  macOptionIsMeta: false,
  rightClickSelectsWord: true,
  windowOptions: { setWinSizeChars: true },
});

const fitAddon = new FitAddon.FitAddon();
term.loadAddon(fitAddon);

term.open(document.getElementById('terminal'));

// ─── Smooth Touch Scrolling for Android Touchscreen ─────────────────────────
let touchStartY = 0;
let touchStartX = 0;
let touchScrollAccumulator = 0;
const terminalEl = document.getElementById('terminal');

terminalEl.addEventListener('touchstart', function(e) {
  if (e.touches.length === 1) {
    touchStartY = e.touches[0].clientY;
    touchStartX = e.touches[0].clientX;
    touchScrollAccumulator = 0;
  }
}, { passive: true });

terminalEl.addEventListener('touchmove', function(e) {
  if (e.touches.length === 1) {
    const currentY = e.touches[0].clientY;
    const currentX = e.touches[0].clientX;
    const deltaY = currentY - touchStartY;
    const deltaX = currentX - touchStartX;

    // Dominant vertical gesture = scroll buffer history up/down smoothly
    if (Math.abs(deltaY) > Math.abs(deltaX)) {
      touchScrollAccumulator += deltaY;
      const cellHeight = 14;
      const lines = Math.trunc(touchScrollAccumulator / cellHeight);
      if (lines !== 0) {
        term.scrollLines(-lines);
        touchScrollAccumulator -= (lines * cellHeight);
      }
      touchStartY = currentY;
    }
  }
}, { passive: true });

// ─── Output from Android (PTY → xterm.js) ────────────────────────────────────
window.writeToTerminal = function(base64data) {
  try {
    const bin = atob(base64data);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    term.write(bytes);
  } catch(e) {
    console.error('writeToTerminal error', e);
  }
};

window.clearTerminal = function() {
  term.clear();
};

// ─── Refresh on Visibility / App Reopen ──────────────────────────────────────
window.refreshTerminal = function() {
  try {
    fitAddon.fit();
    term.refresh(0, Math.max(0, term.rows - 1));
    if (window.AroTerminal) {
      AroTerminal.onResize(term.rows, term.cols);
    }
  } catch(e) {
    console.warn('refreshTerminal error:', e);
  }
};

document.addEventListener('visibilitychange', function() {
  if (!document.hidden) {
    window.refreshTerminal();
  }
});
window.addEventListener('focus', function() {
  window.refreshTerminal();
});

// ─── Input from xterm.js → Android (PTY) ─────────────────────────────────────
term.onData(function(data) {
  if (window.AroTerminal) {
    const b64 = btoa(unescape(encodeURIComponent(data)));
    AroTerminal.sendInput(b64);
  }
});

term.onBinary(function(data) {
  if (window.AroTerminal) {
    const b64 = btoa(data);
    AroTerminal.sendInput(b64);
  }
});

// ─── Resize ──────────────────────────────────────────────────────────────────
let resizeTimer = null;
function doFitAndResize() {
  try {
    fitAddon.fit();
    if (window.AroTerminal) {
      AroTerminal.onResize(term.rows, term.cols);
    }
  } catch(e) { /* ignore during init */ }
}

const resizeObserver = new ResizeObserver(function() {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(doFitAndResize, 60);
});
resizeObserver.observe(document.getElementById('terminal'));

// ─── Startup ──────────────────────────────────────────────────────────────────
let isStarted = false;
function startup() {
  if (isStarted) return;
  isStarted = true;
  try {
    fitAddon.fit();
  } catch(e) {
    console.warn('fitAddon.fit error:', e);
  }
  if (window.AroTerminal) {
    AroTerminal.onReady(term.rows || 24, term.cols || 80);
  }
  try { term.focus(); } catch(e) {}
}

if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(startup).catch(startup);
}
setTimeout(startup, 250);

// ─── Extra-key helpers callable from Kotlin ───────────────────────────────────
window.sendKey = function(seq) {
  if (window.AroTerminal) {
    const b64 = btoa(seq);
    AroTerminal.sendInput(b64);
  }
};

window.pasteText = function(text) {
  const bpText = '\x1b[200~' + text + '\x1b[201~';
  if (window.AroTerminal) {
    const CHUNK = 4096;
    for (let i = 0; i < bpText.length; i += CHUNK) {
      const chunk = bpText.slice(i, i + CHUNK);
      const b64 = btoa(unescape(encodeURIComponent(chunk)));
      AroTerminal.sendInput(b64);
    }
  }
};

window.refocusTerminal = function() {
  term.focus();
  window.refreshTerminal();
};

// ─── Link handling ────────────────────────────────────────────────────────────
term.onLineFeed(function(){});
document.addEventListener('click', function(e) {
  const a = e.target.closest('a');
  if (a && a.href && !a.href.startsWith('data:')) {
    e.preventDefault();
    if (window.AroTerminal) AroTerminal.openUrl(a.href);
  }
});
</script>
</body>
</html>
