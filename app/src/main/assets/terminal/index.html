<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Aro Terminal</title>
<style>
@font-face {
  font-family: 'JetBrainsMono';
  src: url('JetBrainsMono-Regular.woff2') format('woff2');
  font-weight: normal;
  font-style: normal;
  font-display: swap;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%;
  background: #0d1117;
  overflow: hidden;
}
#terminal {
  width: 100%; height: 100%;
}
/* Override xterm default font with JetBrains Mono */
.xterm .xterm-viewport { overflow-y: auto !important; }
.xterm-screen canvas { image-rendering: pixelated; }
</style>
</head>
<body>
<div id="terminal"></div>
<script src="xterm.js"></script>
<script src="xterm-addon-fit.js"></script>
<script>
'use strict';

// ─── Android bridge ──────────────────────────────────────────────────────────
// AroTerminal is injected by Kotlin via addJavascriptInterface
// AroTerminal.sendInput(str)  → send bytes to PTY
// AroTerminal.onReady(rows, cols) → terminal is ready, start PTY
// AroTerminal.onResize(rows, cols) → window resized

// ─── Terminal init ────────────────────────────────────────────────────────────
const term = new Terminal({
  allowProposedApi: true,
  fontFamily: "'JetBrainsMono', 'Droid Sans Mono', 'DejaVu Sans Mono', monospace",
  fontSize: 13,
  lineHeight: 1.15,
  letterSpacing: 0,
  theme: {
    background:   '#0d1117',
    foreground:   '#c9d1d9',
    cursor:       '#58a6ff',
    cursorAccent: '#0d1117',
    black:        '#21262d',
    red:          '#f85149',
    green:        '#3fb950',
    yellow:       '#d29922',
    blue:         '#58a6ff',
    magenta:      '#bc8cff',
    cyan:         '#39c5cf',
    white:        '#b1bac4',
    brightBlack:  '#6e7681',
    brightRed:    '#ff7b72',
    brightGreen:  '#56d364',
    brightYellow: '#e3b341',
    brightBlue:   '#79c0ff',
    brightMagenta:'#d2a8ff',
    brightCyan:   '#56d4dd',
    brightWhite:  '#f0f6fc',
    selectionBackground: '#264f78',
  },
  cursorBlink: true,
  cursorStyle: 'block',
  scrollback: 10000,
  convertEol: false,
  bellStyle: 'none',
  allowTransparency: false,
  disableStdin: false,
  drawBoldTextInBrightColors: true,
  macOptionIsMeta: false,
  rightClickSelectsWord: true,
  // Critical: tell xterm to use the raw ANSI sequences the terminal sends
  windowOptions: { setWinSizeChars: true },
});

const fitAddon = new FitAddon.FitAddon();
term.loadAddon(fitAddon);

term.open(document.getElementById('terminal'));

// ─── Output from Android (PTY → xterm.js) ────────────────────────────────────
// Called by Kotlin via evaluateJavascript
window.writeToTerminal = function(base64data) {
  try {
    const bin = atob(base64data);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    term.write(bytes);
  } catch(e) {
    console.error('writeToTerminal error', e);
  }
};

window.clearTerminal = function() {
  term.clear();
};

// ─── Input from xterm.js → Android (PTY) ─────────────────────────────────────
term.onData(function(data) {
  if (window.AroTerminal) {
    // Send raw data as Base64 to avoid encoding issues
    const b64 = btoa(unescape(encodeURIComponent(data)));
    AroTerminal.sendInput(b64);
  }
});

// Binary data (function keys, paste, etc.)
term.onBinary(function(data) {
  if (window.AroTerminal) {
    const b64 = btoa(data);
    AroTerminal.sendInput(b64);
  }
});

// ─── Resize ──────────────────────────────────────────────────────────────────
let resizeTimer = null;
function doFitAndResize() {
  try {
    fitAddon.fit();
    if (window.AroTerminal) {
      AroTerminal.onResize(term.rows, term.cols);
    }
  } catch(e) { /* ignore during init */ }
}

const resizeObserver = new ResizeObserver(function() {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(doFitAndResize, 60);
});
resizeObserver.observe(document.getElementById('terminal'));

// ─── Startup ──────────────────────────────────────────────────────────────────
function startup() {
  try {
    fitAddon.fit();
  } catch(e) {}
  if (window.AroTerminal) {
    AroTerminal.onReady(term.rows, term.cols);
  }
  // Focus so soft keyboard works immediately
  term.focus();
}

// Give the font time to load
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(startup);
} else {
  setTimeout(startup, 200);
}

// ─── Extra-key helpers callable from Kotlin ───────────────────────────────────
window.sendKey = function(seq) {
  if (window.AroTerminal) {
    const b64 = btoa(seq);
    AroTerminal.sendInput(b64);
  }
};

window.pasteText = function(text) {
  // Bracketed paste
  const bpText = '\x1b[200~' + text + '\x1b[201~';
  if (window.AroTerminal) {
    // send in chunks to avoid backpressure
    const CHUNK = 4096;
    for (let i = 0; i < bpText.length; i += CHUNK) {
      const chunk = bpText.slice(i, i + CHUNK);
      const b64 = btoa(unescape(encodeURIComponent(chunk)));
      AroTerminal.sendInput(b64);
    }
  }
};

window.refocusTerminal = function() {
  term.focus();
};

// ─── Link handling: open in system browser via Android ───────────────────────
term.onLineFeed(function(){});  // keep default
// Block all external navigation; links go via AroTerminal.openUrl if needed
document.addEventListener('click', function(e) {
  const a = e.target.closest('a');
  if (a && a.href && !a.href.startsWith('data:')) {
    e.preventDefault();
    if (window.AroTerminal) AroTerminal.openUrl(a.href);
  }
});
</script>
</body>
</html>
