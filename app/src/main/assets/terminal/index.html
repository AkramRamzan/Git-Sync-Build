<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Aro Terminal</title>
<link rel="stylesheet" href="xterm.css">
<style>
@font-face {
  font-family: 'JetBrainsMono';
  src: url('JetBrainsMono-Regular.woff2') format('woff2');
  font-weight: normal;
  font-style: normal;
  font-display: swap;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%;
  background: #0d1117;
  overflow: hidden;
  touch-action: pan-y;
  overscroll-behavior: contain;
  -webkit-user-select: none;
  user-select: none;
}
#terminal {
  width: 100%; height: 100%;
  touch-action: pan-y;
  overscroll-behavior: contain;
}
/* Override xterm default font with JetBrains Mono and enable smooth touch scrolling */
.xterm .xterm-viewport {
  overflow-y: auto !important;
  touch-action: pan-y !important;
  -webkit-overflow-scrolling: touch !important;
  overscroll-behavior: contain !important;
}
.xterm-screen canvas { image-rendering: pixelated; }

/* ─── Slash Commands Inline Suggestion Bar ──────────────────────────────────── */
/* Positioned dynamically below cursor row — no top-of-screen popup, no reflow */
#slash-palette {
  position: absolute;
  left: 0;
  right: 0;
  background: #161b22;
  border-top: 1px solid #30363d;
  border-bottom: 1px solid #388bfd;
  box-shadow: 0 3px 10px rgba(0, 0, 0, 0.65);
  z-index: 999;
  display: flex;
  flex-direction: column;
  padding: 3px 6px 4px 6px;
  font-family: 'JetBrainsMono', monospace;
  /* Use opacity/visibility for zero-reflow show/hide */
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
  will-change: opacity, transform;
  transition: opacity 0.08s ease, visibility 0.08s ease;
}
#slash-palette.hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
.slash-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 3px;
  padding: 0 1px;
}
.slash-title {
  color: #58a6ff;
  font-size: 8.5px;
  font-weight: 700;
  letter-spacing: 0.4px;
}
.slash-hint {
  color: #6e7681;
  font-size: 7.5px;
}
.slash-list {
  display: flex;
  flex-direction: row;
  overflow-x: auto;
  gap: 4px;
  padding-bottom: 1px;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.slash-list::-webkit-scrollbar { display: none; }
.slash-item {
  display: inline-flex;
  align-items: center;
  background: #21262d;
  border: 1px solid #30363d;
  border-radius: 4px;
  padding: 2px 6px;
  cursor: pointer;
  user-select: none;
  flex-shrink: 0;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
.slash-item:active {
  background: #1f6feb;
  border-color: #58a6ff;
}
.slash-item .cmd-name {
  font-size: 9.5px;
  font-weight: 700;
  color: #f0f6fc;
}
.slash-item .cmd-name .match {
  color: #58a6ff;
  background: rgba(88, 166, 255, 0.18);
  border-radius: 2px;
  padding: 0 1px;
}
.slash-item:active .cmd-name .match {
  color: #fff;
  background: transparent;
}
.slash-item .cmd-desc {
  font-size: 7.5px;
  color: #8b949e;
  margin-left: 4px;
}
.slash-item .cmd-run {
  margin-left: 5px;
  padding: 1px 3px;
  border-radius: 3px;
  background: #238636;
  color: #fff;
  font-size: 7.5px;
  font-weight: 700;
}
</style>
</head>
<body>
<div id="slash-palette" class="hidden">
  <div class="slash-header">
    <span class="slash-title">⚡ SLASH</span>
    <span class="slash-hint">Tap=fill • ↵=run</span>
  </div>
  <div id="slash-list" class="slash-list"></div>
</div>
<div id="terminal"></div>
<script src="xterm.js"></script>
<script src="xterm-addon-fit.js"></script>
<script>
'use strict';

// ─── Modern UTF-8 Base64 Encoder ─────────────────────────────────────────────
function toBase64Utf8(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for (let i = 0; i < bytes.length; i++) {
    bin += String.fromCharCode(bytes[i]);
  }
  return btoa(bin);
}

// ─── Terminal Init (Termux Compact Font Size 9.5 & Crisp Line Height) ────────
const term = new Terminal({
  allowProposedApi: true,
  fontFamily: "'JetBrainsMono', 'Droid Sans Mono', 'DejaVu Sans Mono', monospace",
  fontSize: 9.5,
  lineHeight: 1.1,
  letterSpacing: 0,
  theme: {
    background:   '#0d1117',
    foreground:   '#c9d1d9',
    cursor:       '#58a6ff',
    cursorAccent: '#0d1117',
    black:        '#21262d',
    red:          '#f85149',
    green:        '#3fb950',
    yellow:       '#d29922',
    blue:         '#58a6ff',
    magenta:      '#bc8cff',
    cyan:         '#39c5cf',
    white:        '#b1bac4',
    brightBlack:  '#6e7681',
    brightRed:    '#ff7b72',
    brightGreen:  '#56d364',
    brightYellow: '#e3b341',
    brightBlue:   '#79c0ff',
    brightMagenta:'#d2a8ff',
    brightCyan:   '#56d4dd',
    brightWhite:  '#f0f6fc',
    selectionBackground: '#264f78',
  },
  cursorBlink: true,
  cursorStyle: 'block',
  scrollback: 10000,
  smoothScrollDuration: 80,
  scrollSensitivity: 2,
  fastScrollSensitivity: 4,
  convertEol: false,
  bellStyle: 'none',
  allowTransparency: false,
  disableStdin: false,
  drawBoldTextInBrightColors: true,
  macOptionIsMeta: false,
  rightClickSelectsWord: true,
  windowOptions: { setWinSizeChars: true },
});

const fitAddon = new FitAddon.FitAddon();
term.loadAddon(fitAddon);

term.open(document.getElementById('terminal'));

// ─── Helper Textarea Configuration (Prevents soft keyboard buffering) ────────
function setupInputHandling() {
  const textarea = term.textarea || document.querySelector('.xterm-helper-textarea');
  if (textarea) {
    textarea.setAttribute('autocapitalize', 'none');
    textarea.setAttribute('autocorrect', 'off');
    textarea.setAttribute('autocomplete', 'off');
    textarea.setAttribute('spellcheck', 'false');
    textarea.setAttribute('aria-autocomplete', 'none');
    textarea.setAttribute('enterkeyhint', 'enter');
    textarea.setAttribute('inputmode', 'text');
  }
}
setupInputHandling();

// ─── Native Key Event Delegation ──────────────────────────────────────────────
term.attachCustomKeyEventHandler(function(e) {
  // Let xterm.js process keys natively through its input pipeline.
  // We do NOT intercept Space or Enter here because the helper textarea simultaneously
  // receives the input event, which would cause double command execution / duplicate prompts.
  return true;
});

// ─── Enhanced Fluid Kinetic Touch Scrolling with Velocity & Inertia ───────────
let touchStartY = 0;
let touchStartX = 0;
let touchLastY = 0;
let touchLastTime = 0;
let scrollVelocity = 0;
let touchScrollAccumulator = 0;
let inertiaAnimId = null;

const terminalEl = document.getElementById('terminal');

function stopInertia() {
  if (inertiaAnimId) {
    cancelAnimationFrame(inertiaAnimId);
    inertiaAnimId = null;
  }
}

terminalEl.addEventListener('touchstart', function(e) {
  stopInertia();
  if (e.touches.length === 1) {
    touchStartY = e.touches[0].clientY;
    touchStartX = e.touches[0].clientX;
    touchLastY = touchStartY;
    touchLastTime = performance.now();
    scrollVelocity = 0;
    touchScrollAccumulator = 0;
  }
}, { passive: true });

terminalEl.addEventListener('touchmove', function(e) {
  if (e.touches.length === 1) {
    const currentY = e.touches[0].clientY;
    const currentX = e.touches[0].clientX;
    const deltaY = currentY - touchLastY;
    const totalDeltaY = currentY - touchStartY;
    const totalDeltaX = currentX - touchStartX;
    const now = performance.now();
    const dt = now - touchLastTime;

    if (dt > 8) {
      scrollVelocity = deltaY / dt;
      touchLastTime = now;
      touchLastY = currentY;
    }

    // Dominant vertical gesture = scroll buffer history smoothly
    if (Math.abs(totalDeltaY) > Math.abs(totalDeltaX) || Math.abs(deltaY) > 2) {
      touchScrollAccumulator += deltaY;
      const cellHeight = 11.5;
      const lines = Math.trunc(touchScrollAccumulator / cellHeight);
      if (lines !== 0) {
        term.scrollLines(-lines);
        touchScrollAccumulator -= (lines * cellHeight);
      }
    }
  }
}, { passive: true });

terminalEl.addEventListener('touchend', function(e) {
  const now = performance.now();
  const timeSinceMove = now - touchLastTime;

  // Kinetic momentum on flick gesture
  if (timeSinceMove < 80 && Math.abs(scrollVelocity) > 0.1) {
    let currentVel = scrollVelocity;
    const cellHeight = 11.5;

    function momentumStep() {
      if (Math.abs(currentVel) < 0.02) {
        stopInertia();
        return;
      }
      touchScrollAccumulator += (currentVel * 16);
      const lines = Math.trunc(touchScrollAccumulator / cellHeight);
      if (lines !== 0) {
        term.scrollLines(-lines);
        touchScrollAccumulator -= (lines * cellHeight);
      }
      currentVel *= 0.92; // smooth friction decay
      inertiaAnimId = requestAnimationFrame(momentumStep);
    }

    stopInertia();
    inertiaAnimId = requestAnimationFrame(momentumStep);
  }
}, { passive: true });

// ─── Output from Android (PTY → xterm.js) ────────────────────────────────────
window.writeToTerminal = function(base64data) {
  try {
    const bin = atob(base64data);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    term.write(bytes);
  } catch(e) {
    console.error('writeToTerminal error', e);
  }
};

window.clearTerminal = function() {
  term.write('\x1b[H\x1b[2J\x1b[3J');
};

// ─── Refresh on Visibility / App Reopen ──────────────────────────────────────
window.refreshTerminal = function() {
  try {
    fitAddon.fit();
    term.refresh(0, Math.max(0, term.rows - 1));
    setupInputHandling();
    if (window.AroTerminal) {
      AroTerminal.onResize(term.rows, term.cols);
    }
  } catch(e) {
    console.warn('refreshTerminal error:', e);
  }
};

document.addEventListener('visibilitychange', function() {
  if (!document.hidden) {
    window.refreshTerminal();
  }
});
window.addEventListener('focus', function() {
  window.refreshTerminal();
});

// ─── Slash Commands Inline Autocomplete Engine ────────────────────────────────
// Positions suggestion strip BELOW the current cursor row (inline, not top popup).
// Uses opacity/visibility toggle — zero layout reflow, zero screen flash.
const SLASH_COMMANDS = [
  { cmd: '/model',   desc: 'AI Model' },
  { cmd: '/help',    desc: 'Cheat Sheet' },
  { cmd: '/agy',     desc: 'Anti-Gravity AI' },
  { cmd: '/clear',   desc: 'Clear Screen' },
  { cmd: '/update',  desc: 'apt update' },
  { cmd: '/upgrade', desc: 'apt upgrade' },
  { cmd: '/install', desc: 'apt install' },
  { cmd: '/status',  desc: 'System Stats' },
  { cmd: '/storage', desc: 'cd Downloads' },
  { cmd: '/history', desc: 'Cmd History' },
  { cmd: '/exit',    desc: 'Exit Shell' }
];

let typedLineBuffer = '';
const slashPaletteEl = document.getElementById('slash-palette');
const slashListEl    = document.getElementById('slash-list');

/* ── Get pixel height of one terminal cell row ── */
function getCellHeight() {
  try {
    // xterm.js internal: _core.renderService.dimensions.css.cell.height
    const dims = term._core && term._core.renderService && term._core.renderService.dimensions;
    if (dims && dims.css && dims.css.cell && dims.css.cell.height) {
      return dims.css.cell.height;
    }
  } catch(e) {}
  // fallback: divide screen canvas height by terminal rows
  try {
    const canvas = document.querySelector('.xterm-screen canvas');
    if (canvas && term.rows > 0) return canvas.clientHeight / term.rows;
  } catch(e) {}
  return 18; // safe default
}

/* ── Position palette just below the cursor row ── */
function positionPaletteAtCursor() {
  try {
    const cursorRow = term.buffer.active.cursorY; // 0-indexed row on screen
    const cellH     = getCellHeight();
    // xterm canvas top offset within the page
    const termEl = document.getElementById('terminal');
    const termTop = termEl ? termEl.getBoundingClientRect().top : 0;
    const paletteTop = termTop + (cursorRow + 1) * cellH;
    slashPaletteEl.style.top = Math.round(paletteTop) + 'px';
  } catch(e) {
    // If we can't calculate, show near bottom-third of screen
    slashPaletteEl.style.top = Math.round(window.innerHeight * 0.6) + 'px';
  }
}

function escapeHtml(str) {
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function updateSlashPalette() {
  const trimmed = typedLineBuffer.trim();
  if (!trimmed.startsWith('/')) { hideSlashPalette(); return; }

  const query   = trimmed.toLowerCase();
  const matches = SLASH_COMMANDS.filter(function(item) {
    return item.cmd.toLowerCase().includes(query);
  });
  if (matches.length === 0) { hideSlashPalette(); return; }

  // Prefix matches first, then alphabetical
  matches.sort(function(a, b) {
    const aS = a.cmd.toLowerCase().startsWith(query);
    const bS = b.cmd.toLowerCase().startsWith(query);
    if (aS && !bS) return -1;
    if (!aS && bS) return  1;
    return a.cmd.localeCompare(b.cmd);
  });

  slashListEl.innerHTML = '';
  matches.forEach(function(item) {
    const itemEl = document.createElement('div');
    itemEl.className = 'slash-item';

    const cmdLower = item.cmd.toLowerCase();
    const matchIdx = cmdLower.indexOf(query);
    let nameHtml = '';
    if (matchIdx !== -1) {
      const before = escapeHtml(item.cmd.slice(0, matchIdx));
      const match  = escapeHtml(item.cmd.slice(matchIdx, matchIdx + query.length));
      const after  = escapeHtml(item.cmd.slice(matchIdx + query.length));
      nameHtml = before + '<span class="match">' + match + '</span>' + after;
    } else {
      nameHtml = escapeHtml(item.cmd);
    }

    itemEl.innerHTML =
      '<span class="cmd-name">' + nameHtml + '</span>' +
      '<span class="cmd-desc">' + escapeHtml(item.desc) + '</span>' +
      '<span class="cmd-run" title="Run">↵</span>';

    itemEl.addEventListener('pointerdown', function(e) {
      e.preventDefault();
      e.stopPropagation();
      const isRunBtn = e.target.classList.contains('cmd-run');
      if (window.AroTerminal) {
        if (isRunBtn) {
          AroTerminal.sendInput(toBase64Utf8('\x15' + item.cmd + '\r'));
          typedLineBuffer = '';
        } else {
          AroTerminal.sendInput(toBase64Utf8('\x15' + item.cmd + ' '));
          typedLineBuffer = item.cmd + ' ';
        }
      }
      hideSlashPalette();
      window.refocusTerminal && window.refocusTerminal();
    });

    slashListEl.appendChild(itemEl);
  });

  // Position inline below cursor BEFORE making visible
  positionPaletteAtCursor();
  slashPaletteEl.classList.remove('hidden');
}

function hideSlashPalette() {
  if (slashPaletteEl && !slashPaletteEl.classList.contains('hidden')) {
    slashPaletteEl.classList.add('hidden');
  }
}

// Hide when touching outside palette (passive — no reflow)
document.addEventListener('touchstart', function(e) {
  if (slashPaletteEl && !slashPaletteEl.classList.contains('hidden')) {
    if (!slashPaletteEl.contains(e.target)) hideSlashPalette();
  }
}, { passive: true });

// ─── Input from xterm.js → Android (PTY) ─────────────────────────────────────
term.onData(function(data) {
  // Normalize soft-keyboard newline (\n or \r\n) to carriage return (\r)
  // so POSIX shell and interactive TUI tools (agy, inquirer, readline) receive
  // single Enter submit without duplicating line breaks or commands.
  var out = data;
  if (out === '\n' || out === '\r\n') {
    out = '\r';
  }

  // Real-time tracking of typed buffer for slash command suggestions
  if (out === '\r') {
    typedLineBuffer = '';
    hideSlashPalette();
  } else if (out === '\x7f' || out === '\b') {
    typedLineBuffer = typedLineBuffer.slice(0, -1);
    updateSlashPalette();
  } else if (out === '\x03' || out === '\x1b') { // Ctrl+C or ESC
    typedLineBuffer = '';
    hideSlashPalette();
  } else if (out.length === 1 && out.charCodeAt(0) >= 32) {
    typedLineBuffer += out;
    updateSlashPalette();
  }

  if (window.AroTerminal) {
    AroTerminal.sendInput(toBase64Utf8(out));
  }
});

term.onBinary(function(data) {
  if (window.AroTerminal) {
    AroTerminal.sendInput(btoa(data));
  }
});

// ─── Resize ──────────────────────────────────────────────────────────────────
let resizeTimer = null;
function doFitAndResize() {
  try {
    fitAddon.fit();
    setupInputHandling();
    if (window.AroTerminal) {
      AroTerminal.onResize(term.rows, term.cols);
    }
  } catch(e) { /* ignore during init */ }
}

const resizeObserver = new ResizeObserver(function() {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(doFitAndResize, 60);
});
resizeObserver.observe(document.getElementById('terminal'));

// ─── Startup ──────────────────────────────────────────────────────────────────
let isStarted = false;
function startup() {
  if (isStarted) return;
  isStarted = true;
  try {
    fitAddon.fit();
    setupInputHandling();
  } catch(e) {
    console.warn('fitAddon.fit error:', e);
  }
  if (window.AroTerminal) {
    AroTerminal.onReady(term.rows || 24, term.cols || 80);
  }
  try { term.focus(); } catch(e) {}
}

if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(startup).catch(startup);
}
setTimeout(startup, 250);

// ─── Extra-key helpers callable from Kotlin ───────────────────────────────────
window.sendKey = function(seq) {
  if (window.AroTerminal) {
    AroTerminal.sendInput(toBase64Utf8(seq));
  }
};

window.pasteText = function(text) {
  const bpText = '\x1b[200~' + text + '\x1b[201~';
  if (window.AroTerminal) {
    const CHUNK = 4096;
    for (let i = 0; i < bpText.length; i += CHUNK) {
      const chunk = bpText.slice(i, i + CHUNK);
      AroTerminal.sendInput(toBase64Utf8(chunk));
    }
  }
};

window.refocusTerminal = function() {
  try {
    term.focus();
    setupInputHandling();
    const textarea = term.textarea || document.querySelector('.xterm-helper-textarea');
    if (textarea) { textarea.focus(); }
  } catch(e) {}
  // Do NOT call refreshTerminal() here — it triggers fitAddon.fit() which
  // causes canvas resize → screen flash. Only refocus keyboard/cursor.
};

// ─── Link handling ────────────────────────────────────────────────────────────
term.onLineFeed(function(){});
document.addEventListener('click', function(e) {
  const a = e.target.closest('a');
  if (a && a.href && !a.href.startsWith('data:')) {
    e.preventDefault();
    if (window.AroTerminal) AroTerminal.openUrl(a.href);
  }
});
</script>
</body>
</html>
