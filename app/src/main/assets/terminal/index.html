<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Aro Terminal</title>
<link rel="stylesheet" href="xterm.css">
<style>
@font-face {
  font-family: 'JetBrainsMono';
  src: url('JetBrainsMono-Regular.woff2') format('woff2');
  font-weight: normal;
  font-style: normal;
  font-display: swap;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%;
  background: #0d1117;
  overflow: hidden;
  touch-action: none;
  overscroll-behavior: contain;
  -webkit-user-select: text;
  user-select: text;
}
#terminal {
  width: 100%; height: 100%;
  touch-action: none;
  overscroll-behavior: contain;
}
/* Ensure xterm viewport does not fight custom kinetic touch gestures */
.xterm .xterm-viewport {
  overflow-y: hidden !important;
  touch-action: none !important;
  overscroll-behavior: contain !important;
  pointer-events: none !important;
}
/* Sleek overlay scroll indicator (Termux-style) */
#scroll-indicator {
  position: fixed;
  top: 0;
  right: 2px;
  width: 3.5px;
  background: rgba(255, 255, 255, 0.45);
  border-radius: 3px;
  opacity: 0;
  pointer-events: none;
  z-index: 1000;
  transition: opacity 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}
.xterm-screen {
  transform: translateZ(0);
  backface-visibility: hidden;
}
.xterm-screen canvas {
  image-rendering: auto;
  transform: translateZ(0);
}
</style>
</head>
<body>
<div id="terminal"></div>
<div id="scroll-indicator"></div>
<script src="xterm.js"></script>
<script src="xterm-addon-fit.js"></script>
<script>
'use strict';

// ─── Modern UTF-8 Base64 Encoder ─────────────────────────────────────────────
function toBase64Utf8(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for (let i = 0; i < bytes.length; i++) {
    bin += String.fromCharCode(bytes[i]);
  }
  return btoa(bin);
}

// ─── Active Modifier Keys State (CTRL / ALT from Mobile Keybar) ──────────────
let ctrlModifierActive = false;
let altModifierActive = false;

window.setModifiers = function(ctrl, alt) {
  ctrlModifierActive = !!ctrl;
  altModifierActive = !!alt;
};

// ─── Terminal Init (Termux Compact Font Size 9.5 & Crisp Line Height) ────────
const term = new Terminal({
  allowProposedApi: true,
  fontFamily: "'JetBrainsMono', 'Droid Sans Mono', 'DejaVu Sans Mono', monospace",
  fontSize: 9.5,
  lineHeight: 1.1,
  letterSpacing: 0,
  theme: {
    background:   '#0d1117',
    foreground:   '#c9d1d9',
    cursor:       '#58a6ff',
    cursorAccent: '#0d1117',
    black:        '#21262d',
    red:          '#f85149',
    green:        '#3fb950',
    yellow:       '#d29922',
    blue:         '#58a6ff',
    magenta:      '#bc8cff',
    cyan:         '#39c5cf',
    white:        '#b1bac4',
    brightBlack:  '#6e7681',
    brightRed:    '#ff7b72',
    brightGreen:  '#56d364',
    brightYellow: '#e3b341',
    brightBlue:   '#79c0ff',
    brightMagenta:'#d2a8ff',
    brightCyan:   '#56d4dd',
    brightWhite:  '#f0f6fc',
    selectionBackground: '#264f78',
  },
  cursorBlink: true,
  cursorStyle: 'block',
  scrollback: 10000,
  smoothScrollDuration: 0,
  scrollSensitivity: 2,
  fastScrollSensitivity: 4,
  convertEol: false,
  bellStyle: 'none',
  allowTransparency: false,
  disableStdin: false,
  drawBoldTextInBrightColors: true,
  macOptionIsMeta: false,
  rightClickSelectsWord: true,
  windowOptions: { setWinSizeChars: true },
});

const fitAddon = new FitAddon.FitAddon();
term.loadAddon(fitAddon);

term.open(document.getElementById('terminal'));

// ─── Neutralize xterm.js Internal Viewport Touch & Scroll Handlers ────────────
// Eliminates dual-handler conflict so our kinetic touch engine has exclusive control
try {
  const vp = term._core && term._core.viewport;
  if (vp) {
    vp.handleTouchStart = function() {};
    vp.handleTouchMove = function() { return true; };
    vp._handleScroll = function() {};
    vp._bubbleScroll = function() { return false; };
  }
} catch(e) {
  console.warn('Viewport touch patch warning', e);
}

// ─── Fast Non-Reflow Character Row Height Cache ──────────────────────────────
let cachedRowHeight = 12;
function updateRowHeight() {
  try {
    const dims = term._core && term._core._renderService && term._core._renderService.dimensions;
    if (dims && dims.css && dims.css.cell && dims.css.cell.height > 0) {
      cachedRowHeight = dims.css.cell.height;
      return;
    }
  } catch(_) {}
  try {
    const row = document.querySelector('.xterm-rows > div');
    if (row) {
      const h = row.getBoundingClientRect().height;
      if (h > 0) {
        cachedRowHeight = h;
        return;
      }
    }
  } catch(_) {}
  cachedRowHeight = (term.options.fontSize || 9.5) * (term.options.lineHeight || 1.1);
}
updateRowHeight();

// ─── Sleek Overlay Scroll Indicator (Termux Style) ────────────────────────────
let indicatorFadeTimeout = null;
function updateScrollIndicator() {
  const ind = document.getElementById('scroll-indicator');
  if (!ind) return;
  const buf = term.buffer.active;
  const total = buf.lines.length;
  const visible = term.rows;
  if (total <= visible) {
    ind.style.opacity = '0';
    return;
  }
  const maxScroll = Math.max(1, total - visible);
  const pct = Math.max(0, Math.min(1, buf.viewportY / maxScroll));
  const termHeight = terminalEl.clientHeight || window.innerHeight;
  const thumbHeight = Math.max(24, Math.round((visible / total) * termHeight));
  const thumbTop = Math.round(pct * (termHeight - thumbHeight));

  ind.style.height = thumbHeight + 'px';
  ind.style.top = thumbTop + 'px';
  ind.style.opacity = '1';

  if (indicatorFadeTimeout) clearTimeout(indicatorFadeTimeout);
  indicatorFadeTimeout = setTimeout(function() {
    ind.style.opacity = '0';
  }, 750);
}

// ─── Clickable URL Link Detection (Termux Feature) ────────────────────────────
try {
  term.registerLinkProvider({
    provideLinks: function(bufferLineNumber, callback) {
      try {
        const line = term.buffer.active.getLine(bufferLineNumber - 1);
        if (!line) return callback(undefined);
        const text = line.translateToString(true);
        const urlRegex = /https?:\/\/[^\s"'`<>]+/g;
        const links = [];
        let match;
        while ((match = urlRegex.exec(text)) !== null) {
          const url = match[0];
          const startX = match.index + 1;
          const endX = startX + url.length;
          links.push({
            range: {
              start: { x: startX, y: bufferLineNumber },
              end: { x: endX, y: bufferLineNumber }
            },
            text: url,
            activate: function(e, text) {
              if (window.AroTerminal && window.AroTerminal.openUrl) {
                AroTerminal.openUrl(text);
              }
            }
          });
        }
        callback(links);
      } catch(_) {
        callback(undefined);
      }
    }
  });
} catch(e) {
  console.warn('LinkProvider error:', e);
}

// ─── Helper Textarea Configuration (Prevents soft keyboard buffering) ────────
function setupInputHandling() {
  const textarea = term.textarea || document.querySelector('.xterm-helper-textarea');
  if (textarea) {
    textarea.setAttribute('autocapitalize', 'none');
    textarea.setAttribute('autocorrect', 'off');
    textarea.setAttribute('autocomplete', 'off');
    textarea.setAttribute('spellcheck', 'false');
    textarea.setAttribute('aria-autocomplete', 'none');
    textarea.setAttribute('enterkeyhint', 'enter');
    textarea.setAttribute('inputmode', 'text');
  }
}
setupInputHandling();

// ─── Native Key Event Delegation ──────────────────────────────────────────────
term.attachCustomKeyEventHandler(function(e) {
  return true;
});

// ─── Termux-Calibrated Consistent Smooth Kinetic Touch Scrolling ─────────────
let touchStartY = 0;
let touchLastY = 0;
let touchScrollAccumulator = 0;
let inertiaAnimId = null;

// Windowed touch sample buffer for stable, noise-free velocity tracking
let touchSamples = [];

let pinchStartDist = 0;
let pinchStartFontSize = 9.5;

const terminalEl = document.getElementById('terminal');

function stopInertia() {
  if (inertiaAnimId) {
    cancelAnimationFrame(inertiaAnimId);
    inertiaAnimId = null;
  }
}

function recordTouchSample(y, t) {
  touchSamples.push({ y: y, t: t });
  // Keep only the most recent 80ms window of samples
  const cutoff = t - 80;
  while (touchSamples.length > 2 && touchSamples[0].t < cutoff) {
    touchSamples.shift();
  }
}

function getVelocity() {
  if (touchSamples.length < 2) return 0;
  const first = touchSamples[0];
  const last = touchSamples[touchSamples.length - 1];
  const dt = last.t - first.t;
  if (dt < 10) return 0;
  return (last.y - first.y) / dt;
}

function getPinchDist(e) {
  const dx = e.touches[0].clientX - e.touches[1].clientX;
  const dy = e.touches[0].clientY - e.touches[1].clientY;
  return Math.sqrt(dx * dx + dy * dy);
}

terminalEl.addEventListener('touchstart', function(e) {
  stopInertia();
  touchSamples = [];
  if (e.touches.length === 1) {
    updateRowHeight();
    const y = e.touches[0].clientY;
    touchStartY = y;
    touchLastY = y;
    touchScrollAccumulator = 0;
    recordTouchSample(y, performance.now());
  } else if (e.touches.length === 2) {
    pinchStartDist = getPinchDist(e);
    pinchStartFontSize = term.options.fontSize || 9.5;
  }
}, { passive: true });

terminalEl.addEventListener('touchmove', function(e) {
  if (e.touches.length === 1) {
    if (e.cancelable) e.preventDefault();
    const currentY = e.touches[0].clientY;
    const deltaY = currentY - touchLastY;
    touchLastY = currentY;
    const now = performance.now();
    recordTouchSample(currentY, now);

    // Termux boundary check: guard against accumulating remainder past top/bottom buffer
    const buf = term.buffer.active;
    const isAtTop = buf.viewportY <= 0;
    const isAtBottom = buf.viewportY >= buf.baseY;

    if ((isAtTop && deltaY > 0) || (isAtBottom && deltaY < 0)) {
      touchScrollAccumulator = 0;
      return;
    }

    // 1:1 true physical drag — finger and terminal text move in perfect lockstep
    touchScrollAccumulator += deltaY;
    const lines = Math.trunc(touchScrollAccumulator / cachedRowHeight);
    if (lines !== 0) {
      term.scrollLines(-lines);
      touchScrollAccumulator -= (lines * cachedRowHeight);
      updateScrollIndicator();
    }
  } else if (e.touches.length === 2) {
    if (e.cancelable) e.preventDefault();
    const dist = getPinchDist(e);
    if (pinchStartDist > 0) {
      const scale = dist / pinchStartDist;
      const newSize = Math.min(22, Math.max(6, pinchStartFontSize * scale));
      if (Math.abs(newSize - term.options.fontSize) >= 0.5) {
        window.setFontSize(Math.round(newSize * 2) / 2);
      }
    }
  }
}, { passive: false });

terminalEl.addEventListener('touchend', function(e) {
  const now = performance.now();
  const lastSample = touchSamples[touchSamples.length - 1];

  // If user paused finger for more than 65ms before release, keep position without fling
  if (lastSample && (now - lastSample.t) <= 65) {
    let vel = getVelocity(); // px/ms
    if (Math.abs(vel) > 0.05) {
      vel = Math.max(-3.5, Math.min(3.5, vel));

      let lastFrame = performance.now();

      function momentumStep(frameNow) {
        const dt = Math.min(32, Math.max(1, frameNow - lastFrame));
        lastFrame = frameNow;

        const buf = term.buffer.active;
        // Stop immediately if hitting top or bottom boundary
        if ((vel > 0 && buf.viewportY <= 0) || (vel < 0 && buf.viewportY >= buf.baseY)) {
          stopInertia();
          touchScrollAccumulator = 0;
          return;
        }

        // Physical distance = velocity * elapsed time
        touchScrollAccumulator += (vel * dt);
        const lines = Math.trunc(touchScrollAccumulator / cachedRowHeight);
        if (lines !== 0) {
          term.scrollLines(-lines);
          touchScrollAccumulator -= (lines * cachedRowHeight);
          updateScrollIndicator();
        }

        if (Math.abs(vel) < 0.015) {
          stopInertia();
          return;
        }

        // Termux / Android standard smooth friction deceleration
        const decay = Math.pow(0.965, dt / 16.0);
        vel *= decay;

        inertiaAnimId = requestAnimationFrame(momentumStep);
      }

      stopInertia();
      inertiaAnimId = requestAnimationFrame(momentumStep);
    }
  }
  touchSamples = [];
}, { passive: true });

terminalEl.addEventListener('touchcancel', function() {
  stopInertia();
  touchSamples = [];
}, { passive: true });

// ─── Termux-style Copy-on-Select & Bell ───────────────────────────────────────
term.onSelectionChange(function() {
  const sel = term.getSelection();
  if (sel && sel.trim().length > 0 && window.AroTerminal && AroTerminal.onTextSelected) {
    AroTerminal.onTextSelected(toBase64Utf8(sel));
  }
});

term.onBell(function() {
  if (window.AroTerminal && AroTerminal.onBell) {
    AroTerminal.onBell();
  }
});


// ─── Output from Android (PTY → xterm.js) ────────────────────────────────────
window.writeToTerminal = function(base64data) {
  try {
    const bin = atob(base64data);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    term.write(bytes);
  } catch(e) {
    console.error('writeToTerminal error', e);
  }
};

window.clearTerminal = function() {
  term.write('\x1b[H\x1b[2J\x1b[3J');
};

// ─── Dynamic Font Sizing ──────────────────────────────────────────────────────
window.setFontSize = function(size) {
  try {
    term.options.fontSize = size;
    pinchStartFontSize = size; // keep pinch baseline in sync
    fitAddon.fit();
    updateRowHeight();
    setupInputHandling();
    if (window.AroTerminal) {
      AroTerminal.onResize(term.rows, term.cols);
      AroTerminal.onFontSizeChanged(size); // notify Kotlin for A-/A+ button sync
    }
  } catch(e) {
    console.warn('setFontSize error:', e);
  }
};

// ─── Refresh on Visibility / App Reopen ──────────────────────────────────────
window.refreshTerminal = function() {
  try {
    fitAddon.fit();
    updateRowHeight();
    term.refresh(0, Math.max(0, term.rows - 1));
    setupInputHandling();
    if (window.AroTerminal) {
      AroTerminal.onResize(term.rows, term.cols);
    }
  } catch(e) {
    console.warn('refreshTerminal error:', e);
  }
};

document.addEventListener('visibilitychange', function() {
  if (!document.hidden) {
    window.refreshTerminal();
  }
});
window.addEventListener('focus', function() {
  try {
    const textarea = term.textarea || document.querySelector('.xterm-helper-textarea');
    if (textarea) textarea.focus({ preventScroll: true });
  } catch(e) {}
});

// ─── Input from xterm.js → Android (PTY) with Universal Modifiers ────────────
term.onData(function(data) {
  var out = data;

  if (ctrlModifierActive) {
    // Notify native Android to consume modifier if not locked
    if (window.AroTerminal && window.AroTerminal.onModifierConsumed) {
      AroTerminal.onModifierConsumed('CTRL');
    }
    // Convert ASCII letters to Control Bytes:
    // 'A'-'Z' (65..90) & 'a'-'z' (97..122) -> 1..26
    // E.g. 'O'/'o' -> 15 (Ctrl+O), 'C'/'c' -> 3 (Ctrl+C), 'Z'/'z' -> 26 (Ctrl+Z)
    var ctrlStr = '';
    for (var i = 0; i < out.length; i++) {
      var code = out.charCodeAt(i);
      if (code >= 65 && code <= 90) { // 'A'-'Z'
        ctrlStr += String.fromCharCode(code - 64);
      } else if (code >= 97 && code <= 122) { // 'a'-'z'
        ctrlStr += String.fromCharCode(code - 96);
      } else if (code === 32 || code === 64) { // Space or @ -> NUL (0x00)
        ctrlStr += String.fromCharCode(0);
      } else if (code >= 91 && code <= 95) { // [ \ ] ^ _ -> 27..31
        ctrlStr += String.fromCharCode(code - 64);
      } else if (code === 63) { // ? -> DEL (0x7F)
        ctrlStr += String.fromCharCode(127);
      } else {
        ctrlStr += out[i];
      }
    }
    out = ctrlStr;
  } else if (altModifierActive) {
    if (window.AroTerminal && window.AroTerminal.onModifierConsumed) {
      AroTerminal.onModifierConsumed('ALT');
    }
    out = '\x1b' + out;
  } else {
    // Normalize soft-keyboard newline (\n or \r\n) to carriage return (\r)
    if (out === '\n' || out === '\r\n') {
      out = '\r';
    }
  }

  if (window.AroTerminal) {
    AroTerminal.sendInput(toBase64Utf8(out));
  }
});

term.onBinary(function(data) {
  if (window.AroTerminal) {
    AroTerminal.sendInput(btoa(data));
  }
});

// ─── Resize ──────────────────────────────────────────────────────────────────
let resizeTimer = null;
function doFitAndResize() {
  try {
    fitAddon.fit();
    updateRowHeight();
    setupInputHandling();
    if (window.AroTerminal) {
      AroTerminal.onResize(term.rows, term.cols);
    }
  } catch(e) { /* ignore during init */ }
}

const resizeObserver = new ResizeObserver(function() {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(doFitAndResize, 60);
});
resizeObserver.observe(document.getElementById('terminal'));

// ─── Startup ──────────────────────────────────────────────────────────────────
let isStarted = false;
function startup() {
  if (isStarted) return;
  isStarted = true;
  try {
    fitAddon.fit();
    updateRowHeight();
    setupInputHandling();
  } catch(e) {
    console.warn('fitAddon.fit error:', e);
  }
  if (window.AroTerminal) {
    AroTerminal.onReady(term.rows || 24, term.cols || 80);
  }
  try { term.focus(); } catch(e) {}
}

if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(startup).catch(startup);
}
setTimeout(startup, 250);

// ─── Extra-key helpers callable from Kotlin ───────────────────────────────────
window.sendKey = function(seq) {
  if (window.AroTerminal) {
    AroTerminal.sendInput(toBase64Utf8(seq));
  }
};

window.pasteText = function(text) {
  const bpText = '\x1b[200~' + text + '\x1b[201~';
  if (window.AroTerminal) {
    const CHUNK = 4096;
    for (let i = 0; i < bpText.length; i += CHUNK) {
      const chunk = bpText.slice(i, i + CHUNK);
      AroTerminal.sendInput(toBase64Utf8(chunk));
    }
  }
};

window.refocusTerminal = function() {
  try {
    term.focus();
    setupInputHandling();
    const textarea = term.textarea || document.querySelector('.xterm-helper-textarea');
    if (textarea) { textarea.focus(); }
  } catch(e) {}
};

// ─── Link handling ────────────────────────────────────────────────────────────
term.onLineFeed(function(){});
document.addEventListener('click', function(e) {
  const a = e.target.closest('a');
  if (a && a.href && !a.href.startsWith('data:')) {
    e.preventDefault();
    if (window.AroTerminal) AroTerminal.openUrl(a.href);
  }
});
</script>
</body>
</html>
