<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Aro Terminal</title>
<link rel="stylesheet" href="xterm.css">
<style>
@font-face {
  font-family: 'JetBrainsMono';
  src: url('JetBrainsMono-Regular.woff2') format('woff2');
  font-weight: normal;
  font-style: normal;
  font-display: swap;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%;
  background: #0d1117;
  overflow: hidden;
  touch-action: pan-y;
  overscroll-behavior: contain;
  -webkit-user-select: none;
  user-select: none;
}
#terminal {
  width: 100%; height: 100%;
  touch-action: pan-y;
  overscroll-behavior: contain;
}
/* Override xterm default font with JetBrains Mono and enable smooth touch scrolling */
.xterm .xterm-viewport {
  overflow-y: auto !important;
  touch-action: pan-y !important;
  -webkit-overflow-scrolling: touch !important;
  overscroll-behavior: contain !important;
}
.xterm-screen canvas { image-rendering: pixelated; }

/* ─── Dynamic Slash-Command Inline Suggestion Bar ───────────────────────────── */
/* Positioned dynamically below cursor row — zero reflow, no top popup         */
#slash-palette {
  position: absolute;
  left: 0;
  right: 0;
  background: rgba(13, 17, 23, 0.97);
  border-top: 1px solid #1f6feb;
  border-bottom: 1px solid #1f6feb;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.75);
  z-index: 999;
  padding: 4px 6px;
  font-family: 'JetBrainsMono', monospace;
  /* Zero-reflow show/hide: opacity+visibility (GPU composite only) */
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
  will-change: opacity;
  transition: opacity 0.07s ease, visibility 0.07s ease;
}
#slash-palette.hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

/* ── Horizontal scrollable chip row ── */
#slash-list {
  display: flex;
  flex-direction: row;
  overflow-x: auto;
  gap: 4px;
  padding-bottom: 1px;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
#slash-list::-webkit-scrollbar { display: none; }

/* ── Individual command chip ── */
.sp-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: #161b22;
  border: 1px solid #30363d;
  border-radius: 5px;
  padding: 3px 7px;
  flex-shrink: 0;
  cursor: pointer;
  user-select: none;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  transition: background 0.08s ease, border-color 0.08s ease;
}
.sp-chip:active {
  background: #1f6feb;
  border-color: #58a6ff;
}
/* Dynamic (bash-discovered) chips get a subtle purple tint */
.sp-chip-dynamic {
  border-color: #3d2b7a;
}
.sp-chip-dynamic:active {
  background: #4c2b8a;
  border-color: #bc8cff;
}

/* ── Chip text elements ── */
.sp-cmd {
  font-size: 9.5px;
  font-weight: 700;
  color: #e6edf3;
  letter-spacing: -0.1px;
}
.sp-match {
  color: #58a6ff;
  background: rgba(88,166,255,0.15);
  border-radius: 2px;
  padding: 0 1px;
}
.sp-chip:active .sp-match {
  color: #fff;
  background: transparent;
}
.sp-desc {
  font-size: 7.5px;
  color: #7d8590;
}
.sp-run {
  font-size: 9px;
  font-weight: 700;
  color: #fff;
  background: #238636;
  border-radius: 3px;
  padding: 1px 3px;
  flex-shrink: 0;
}
</style>
</head>
<body>
<div id="slash-palette" class="hidden">
  <div id="slash-list"></div>
</div>
<div id="terminal"></div>
<script src="xterm.js"></script>
<script src="xterm-addon-fit.js"></script>
<script>
'use strict';

// ─── Modern UTF-8 Base64 Encoder ─────────────────────────────────────────────
function toBase64Utf8(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for (let i = 0; i < bytes.length; i++) {
    bin += String.fromCharCode(bytes[i]);
  }
  return btoa(bin);
}

// ─── Terminal Init (Termux Compact Font Size 9.5 & Crisp Line Height) ────────
const term = new Terminal({
  allowProposedApi: true,
  fontFamily: "'JetBrainsMono', 'Droid Sans Mono', 'DejaVu Sans Mono', monospace",
  fontSize: 9.5,
  lineHeight: 1.1,
  letterSpacing: 0,
  theme: {
    background:   '#0d1117',
    foreground:   '#c9d1d9',
    cursor:       '#58a6ff',
    cursorAccent: '#0d1117',
    black:        '#21262d',
    red:          '#f85149',
    green:        '#3fb950',
    yellow:       '#d29922',
    blue:         '#58a6ff',
    magenta:      '#bc8cff',
    cyan:         '#39c5cf',
    white:        '#b1bac4',
    brightBlack:  '#6e7681',
    brightRed:    '#ff7b72',
    brightGreen:  '#56d364',
    brightYellow: '#e3b341',
    brightBlue:   '#79c0ff',
    brightMagenta:'#d2a8ff',
    brightCyan:   '#56d4dd',
    brightWhite:  '#f0f6fc',
    selectionBackground: '#264f78',
  },
  cursorBlink: true,
  cursorStyle: 'block',
  scrollback: 10000,
  smoothScrollDuration: 80,
  scrollSensitivity: 2,
  fastScrollSensitivity: 4,
  convertEol: false,
  bellStyle: 'none',
  allowTransparency: false,
  disableStdin: false,
  drawBoldTextInBrightColors: true,
  macOptionIsMeta: false,
  rightClickSelectsWord: true,
  windowOptions: { setWinSizeChars: true },
});

const fitAddon = new FitAddon.FitAddon();
term.loadAddon(fitAddon);

term.open(document.getElementById('terminal'));

// ─── Helper Textarea Configuration (Prevents soft keyboard buffering) ────────
function setupInputHandling() {
  const textarea = term.textarea || document.querySelector('.xterm-helper-textarea');
  if (textarea) {
    textarea.setAttribute('autocapitalize', 'none');
    textarea.setAttribute('autocorrect', 'off');
    textarea.setAttribute('autocomplete', 'off');
    textarea.setAttribute('spellcheck', 'false');
    textarea.setAttribute('aria-autocomplete', 'none');
    textarea.setAttribute('enterkeyhint', 'enter');
    textarea.setAttribute('inputmode', 'text');
  }
}
setupInputHandling();

// ─── Native Key Event Delegation ──────────────────────────────────────────────
term.attachCustomKeyEventHandler(function(e) {
  // Let xterm.js process keys natively through its input pipeline.
  // We do NOT intercept Space or Enter here because the helper textarea simultaneously
  // receives the input event, which would cause double command execution / duplicate prompts.
  return true;
});

// ─── Enhanced Fluid Kinetic Touch Scrolling with Velocity & Inertia ───────────
let touchStartY = 0;
let touchStartX = 0;
let touchLastY = 0;
let touchLastTime = 0;
let scrollVelocity = 0;
let touchScrollAccumulator = 0;
let inertiaAnimId = null;

const terminalEl = document.getElementById('terminal');

function stopInertia() {
  if (inertiaAnimId) {
    cancelAnimationFrame(inertiaAnimId);
    inertiaAnimId = null;
  }
}

terminalEl.addEventListener('touchstart', function(e) {
  stopInertia();
  if (e.touches.length === 1) {
    touchStartY = e.touches[0].clientY;
    touchStartX = e.touches[0].clientX;
    touchLastY = touchStartY;
    touchLastTime = performance.now();
    scrollVelocity = 0;
    touchScrollAccumulator = 0;
  }
}, { passive: true });

terminalEl.addEventListener('touchmove', function(e) {
  if (e.touches.length === 1) {
    const currentY = e.touches[0].clientY;
    const currentX = e.touches[0].clientX;
    const deltaY = currentY - touchLastY;
    const totalDeltaY = currentY - touchStartY;
    const totalDeltaX = currentX - touchStartX;
    const now = performance.now();
    const dt = now - touchLastTime;

    if (dt > 8) {
      scrollVelocity = deltaY / dt;
      touchLastTime = now;
      touchLastY = currentY;
    }

    // Dominant vertical gesture = scroll buffer history smoothly
    if (Math.abs(totalDeltaY) > Math.abs(totalDeltaX) || Math.abs(deltaY) > 2) {
      touchScrollAccumulator += deltaY;
      const cellHeight = 11.5;
      const lines = Math.trunc(touchScrollAccumulator / cellHeight);
      if (lines !== 0) {
        term.scrollLines(-lines);
        touchScrollAccumulator -= (lines * cellHeight);
      }
    }
  }
}, { passive: true });

terminalEl.addEventListener('touchend', function(e) {
  const now = performance.now();
  const timeSinceMove = now - touchLastTime;

  // Kinetic momentum on flick gesture
  if (timeSinceMove < 80 && Math.abs(scrollVelocity) > 0.1) {
    let currentVel = scrollVelocity;
    const cellHeight = 11.5;

    function momentumStep() {
      if (Math.abs(currentVel) < 0.02) {
        stopInertia();
        return;
      }
      touchScrollAccumulator += (currentVel * 16);
      const lines = Math.trunc(touchScrollAccumulator / cellHeight);
      if (lines !== 0) {
        term.scrollLines(-lines);
        touchScrollAccumulator -= (lines * cellHeight);
      }
      currentVel *= 0.92; // smooth friction decay
      inertiaAnimId = requestAnimationFrame(momentumStep);
    }

    stopInertia();
    inertiaAnimId = requestAnimationFrame(momentumStep);
  }
}, { passive: true });

// ─── Output from Android (PTY → xterm.js) ────────────────────────────────────
window.writeToTerminal = function(base64data) {
  try {
    const bin = atob(base64data);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    term.write(bytes);
  } catch(e) {
    console.error('writeToTerminal error', e);
  }
};

window.clearTerminal = function() {
  term.write('\x1b[H\x1b[2J\x1b[3J');
};

// ─── Refresh on Visibility / App Reopen ──────────────────────────────────────
window.refreshTerminal = function() {
  try {
    fitAddon.fit();
    term.refresh(0, Math.max(0, term.rows - 1));
    setupInputHandling();
    if (window.AroTerminal) {
      AroTerminal.onResize(term.rows, term.cols);
    }
  } catch(e) {
    console.warn('refreshTerminal error:', e);
  }
};

document.addEventListener('visibilitychange', function() {
  if (!document.hidden) {
    window.refreshTerminal();
  }
});
window.addEventListener('focus', function() {
  window.refreshTerminal();
});

// ═══════════════════════════════════════════════════════════════════════════════
// Dynamic Slash-Command Autocomplete Engine  (Termux-style, inline below cursor)
// ═══════════════════════════════════════════════════════════════════════════════
//
// Architecture:
//   • STATIC_COMMANDS  — built-in slash commands always available
//   • Dynamic layer    — queries AroTerminal.queryCompletions(prefix) → bash compgen
//   • Merged results   — static + dynamic, deduplicated, prefix-sorted
//   • Inline position  — rendered below the current cursor row (no top popup)
//   • Zero reflow      — opacity/visibility toggle, never display:none
//   • MobileKeyBar     — hidden via AroTerminal.onSlashPaletteShown/Hidden bridge
//
// ── Built-in Slash Commands (always available, context-independent) ──────────

const STATIC_COMMANDS = [
  // Core terminal
  { cmd: '/clear',   desc: 'Clear screen',        group: 'terminal' },
  { cmd: '/exit',    desc: 'Exit shell',           group: 'terminal' },
  { cmd: '/history', desc: 'Recent commands',      group: 'terminal' },
  { cmd: '/status',  desc: 'CPU · RAM · Disk',     group: 'terminal' },
  // AI & Agents
  { cmd: '/agy',     desc: 'Antigravity AI',       group: 'ai'       },
  { cmd: '/model',   desc: 'Switch AI model',      group: 'ai'       },
  { cmd: '/help',    desc: 'Command cheat sheet',  group: 'ai'       },
  // Package management
  { cmd: '/update',  desc: 'apt update',           group: 'pkg'      },
  { cmd: '/upgrade', desc: 'apt upgrade',          group: 'pkg'      },
  { cmd: '/install', desc: 'apt install <pkg>',    group: 'pkg'      },
  // Filesystem
  { cmd: '/storage', desc: 'cd ~/Download',        group: 'fs'       },
];

// ── State ────────────────────────────────────────────────────────────────────

let typedLineBuffer  = '';     // chars typed on current line
let dynamicSuggestions = [];   // filled by AroTerminal.queryCompletions callback
let paletteVisible   = false;
let compgenPending   = false;  // debounce flag

const slashPaletteEl = document.getElementById('slash-palette');
const slashListEl    = document.getElementById('slash-list');

// ── Bash compgen callback (Direction D: Android → JS) ────────────────────────
// Called by XtermJsInterface after `compgen -c <prefix>` finishes

window.aroCompletionsCallback = function(namesArray) {
  // namesArray is a JS array of bare command names (strings), e.g. ["model","help"]
  dynamicSuggestions = (namesArray || []).map(function(name) {
    return { cmd: '/' + name, desc: name, group: 'dynamic' };
  });
  compgenPending = false;
  renderPalette();
};

// ── Cell-height helper ────────────────────────────────────────────────────────

function getCellHeight() {
  try {
    const dims = term._core && term._core.renderService && term._core.renderService.dimensions;
    if (dims && dims.css && dims.css.cell && dims.css.cell.height) return dims.css.cell.height;
  } catch(e) {}
  try {
    const canvas = document.querySelector('.xterm-screen canvas');
    if (canvas && term.rows > 0) return canvas.clientHeight / term.rows;
  } catch(e) {}
  return 18;
}

// ── Position palette directly below the cursor row ───────────────────────────

function positionPaletteAtCursor() {
  try {
    const cursorRow = term.buffer.active.cursorY;
    const cellH     = getCellHeight();
    const termEl    = document.getElementById('terminal');
    const termTop   = termEl ? termEl.getBoundingClientRect().top : 0;
    // Clamp so palette doesn't go below viewport
    const rawTop    = termTop + (cursorRow + 1) * cellH;
    const maxTop    = window.innerHeight - 60;
    slashPaletteEl.style.top = Math.round(Math.min(rawTop, maxTop)) + 'px';
  } catch(e) {
    slashPaletteEl.style.top = Math.round(window.innerHeight * 0.55) + 'px';
  }
}

// ── HTML escaping ─────────────────────────────────────────────────────────────

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

// ── Highlight matching substring ──────────────────────────────────────────────

function highlightMatch(text, query) {
  const lc = text.toLowerCase();
  const idx = lc.indexOf(query);
  if (idx === -1) return escapeHtml(text);
  return escapeHtml(text.slice(0, idx)) +
    '<span class="sp-match">' + escapeHtml(text.slice(idx, idx + query.length)) + '</span>' +
    escapeHtml(text.slice(idx + query.length));
}

// ── Build merged, deduplicated, sorted suggestion list ───────────────────────

function buildSuggestions(query) {
  const seen  = new Set();
  const all   = [];

  // 1. Static built-ins first (always shown, always filtered)
  STATIC_COMMANDS.forEach(function(item) {
    const cmdLc = item.cmd.toLowerCase();
    if (cmdLc.includes(query) && !seen.has(item.cmd)) {
      seen.add(item.cmd);
      all.push({ cmd: item.cmd, desc: item.desc, isStatic: true });
    }
  });

  // 2. Dynamic results from bash compgen (merged in, no duplicates)
  dynamicSuggestions.forEach(function(item) {
    const cmdLc = item.cmd.toLowerCase();
    if (cmdLc.includes(query) && !seen.has(item.cmd)) {
      seen.add(item.cmd);
      all.push({ cmd: item.cmd, desc: item.desc, isStatic: false });
    }
  });

  // Sort: prefix matches first, then static before dynamic, then alphabetical
  all.sort(function(a, b) {
    const aPrefix = a.cmd.toLowerCase().startsWith(query);
    const bPrefix = b.cmd.toLowerCase().startsWith(query);
    if (aPrefix !== bPrefix) return aPrefix ? -1 : 1;
    if (a.isStatic !== b.isStatic) return a.isStatic ? -1 : 1;
    return a.cmd.localeCompare(b.cmd);
  });

  return all.slice(0, 20); // cap at 20 items
}

// ── Render palette DOM ────────────────────────────────────────────────────────

function renderPalette() {
  const trimmed = typedLineBuffer.trim();
  if (!trimmed.startsWith('/')) { hidePalette(); return; }

  const query   = trimmed.toLowerCase();
  const matches = buildSuggestions(query);

  if (matches.length === 0) { hidePalette(); return; }

  // Rebuild list items
  slashListEl.innerHTML = '';
  matches.forEach(function(item) {
    const chip = document.createElement('div');
    chip.className = 'sp-chip' + (item.isStatic ? '' : ' sp-chip-dynamic');

    chip.innerHTML =
      '<span class="sp-cmd">' + highlightMatch(item.cmd, query) + '</span>' +
      '<span class="sp-desc">' + escapeHtml(item.desc) + '</span>' +
      '<span class="sp-run" title="Run now">↵</span>';

    chip.addEventListener('pointerdown', function(e) {
      e.preventDefault();
      e.stopPropagation();
      const isRun = e.target.classList.contains('sp-run');
      if (window.AroTerminal) {
        if (isRun) {
          // Ctrl+U clears typed line, then sends command + Enter
          AroTerminal.sendInput(toBase64Utf8('\x15' + item.cmd + '\r'));
          typedLineBuffer = '';
        } else {
          // Fill the command (with trailing space for arguments)
          AroTerminal.sendInput(toBase64Utf8('\x15' + item.cmd + ' '));
          typedLineBuffer = item.cmd + ' ';
        }
      }
      hidePalette();
    });

    slashListEl.appendChild(chip);
  });

  positionPaletteAtCursor();

  if (!paletteVisible) {
    slashPaletteEl.classList.remove('hidden');
    paletteVisible = true;
    // Notify Android to hide MobileKeyBar
    if (window.AroTerminal && AroTerminal.onSlashPaletteShown) {
      AroTerminal.onSlashPaletteShown();
    }
  }
}

// ── Show palette: merge static + trigger dynamic query ───────────────────────

function showPalette() {
  const trimmed = typedLineBuffer.trim();
  if (!trimmed.startsWith('/')) { hidePalette(); return; }

  // Render immediately with static commands (instant response)
  renderPalette();

  // Then asynchronously fetch dynamic bash completions
  const prefix = trimmed.slice(1); // strip leading /
  if (!compgenPending && window.AroTerminal && AroTerminal.queryCompletions) {
    compgenPending = true;
    AroTerminal.queryCompletions(prefix);
    // compgenPending = false is set inside aroCompletionsCallback
  }
}

// ── Hide palette ──────────────────────────────────────────────────────────────

function hidePalette() {
  if (!paletteVisible) return;
  slashPaletteEl.classList.add('hidden');
  paletteVisible = false;
  dynamicSuggestions = [];
  compgenPending = false;
  // Notify Android to restore MobileKeyBar
  if (window.AroTerminal && AroTerminal.onSlashPaletteHidden) {
    AroTerminal.onSlashPaletteHidden();
  }
}

// ── Dismiss on outside touch ──────────────────────────────────────────────────

document.addEventListener('touchstart', function(e) {
  if (paletteVisible && slashPaletteEl && !slashPaletteEl.contains(e.target)) {
    hidePalette();
  }
}, { passive: true });

// ─── Input from xterm.js → Android (PTY) ─────────────────────────────────────
term.onData(function(data) {
  // Normalize soft-keyboard newline (\n or \r\n) to carriage return (\r)
  // so POSIX shell and interactive TUI tools (agy, inquirer, readline) receive
  // single Enter submit without duplicating line breaks or commands.
  var out = data;
  if (out === '\n' || out === '\r\n') {
    out = '\r';
  }

  // Real-time tracking of typed buffer for slash command suggestions
  if (out === '\r') {
    typedLineBuffer = '';
    hidePalette();
  } else if (out === '\x7f' || out === '\b') {
    typedLineBuffer = typedLineBuffer.slice(0, -1);
    showPalette();
  } else if (out === '\x03' || out === '\x1b') { // Ctrl+C or ESC
    typedLineBuffer = '';
    hidePalette();
  } else if (out.length === 1 && out.charCodeAt(0) >= 32) {
    typedLineBuffer += out;
    showPalette();
  }

  if (window.AroTerminal) {
    AroTerminal.sendInput(toBase64Utf8(out));
  }
});

term.onBinary(function(data) {
  if (window.AroTerminal) {
    AroTerminal.sendInput(btoa(data));
  }
});

// ─── Resize ──────────────────────────────────────────────────────────────────
let resizeTimer = null;
function doFitAndResize() {
  try {
    fitAddon.fit();
    setupInputHandling();
    if (window.AroTerminal) {
      AroTerminal.onResize(term.rows, term.cols);
    }
  } catch(e) { /* ignore during init */ }
}

const resizeObserver = new ResizeObserver(function() {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(doFitAndResize, 60);
});
resizeObserver.observe(document.getElementById('terminal'));

// ─── Startup ──────────────────────────────────────────────────────────────────
let isStarted = false;
function startup() {
  if (isStarted) return;
  isStarted = true;
  try {
    fitAddon.fit();
    setupInputHandling();
  } catch(e) {
    console.warn('fitAddon.fit error:', e);
  }
  if (window.AroTerminal) {
    AroTerminal.onReady(term.rows || 24, term.cols || 80);
  }
  try { term.focus(); } catch(e) {}
}

if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(startup).catch(startup);
}
setTimeout(startup, 250);

// ─── Extra-key helpers callable from Kotlin ───────────────────────────────────
window.sendKey = function(seq) {
  if (window.AroTerminal) {
    AroTerminal.sendInput(toBase64Utf8(seq));
  }
};

window.pasteText = function(text) {
  const bpText = '\x1b[200~' + text + '\x1b[201~';
  if (window.AroTerminal) {
    const CHUNK = 4096;
    for (let i = 0; i < bpText.length; i += CHUNK) {
      const chunk = bpText.slice(i, i + CHUNK);
      AroTerminal.sendInput(toBase64Utf8(chunk));
    }
  }
};

window.refocusTerminal = function() {
  try {
    term.focus();
    setupInputHandling();
    const textarea = term.textarea || document.querySelector('.xterm-helper-textarea');
    if (textarea) { textarea.focus(); }
  } catch(e) {}
  // Do NOT call refreshTerminal() here — it triggers fitAddon.fit() which
  // causes canvas resize → screen flash. Only refocus keyboard/cursor.
};

// ─── Link handling ────────────────────────────────────────────────────────────
term.onLineFeed(function(){});
document.addEventListener('click', function(e) {
  const a = e.target.closest('a');
  if (a && a.href && !a.href.startsWith('data:')) {
    e.preventDefault();
    if (window.AroTerminal) AroTerminal.openUrl(a.href);
  }
});
</script>
</body>
</html>
