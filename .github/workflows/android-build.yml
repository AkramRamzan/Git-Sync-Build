name: Android Cloud Build

on:
  repository_dispatch:
    types: [build-debug, build-release]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (debug | release)'
        required: true
        default: 'debug'

jobs:
  build:
    name: Gradle Build & Sign
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.branch || 'main' }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ── Debug Build ─────────────────────────────────────────────────────────
      - name: Build Debug APK
        if: >
          github.event.action == 'build-debug' ||
          github.event.inputs.build_type == 'debug'
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        if: >
          github.event.action == 'build-debug' ||
          github.event.inputs.build_type == 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Publish Direct Download Release
        if: >
          github.event.action == 'build-debug' ||
          github.event.inputs.build_type == 'debug'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes || true
          git tag -d latest || true
          git push origin :refs/tags/latest || true
          gh release create latest app/build/outputs/apk/debug/*.apk \
            --title "Aro Code Latest Debug APK" \
            --notes "Direct 1-click download of the latest debug APK. No authentication required."

      # ── Release Build ───────────────────────────────────────────────────────
      - name: Decode Release Keystore
        if: >
          github.event.action == 'build-release' ||
          github.event.inputs.build_type == 'release'
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > $GITHUB_WORKSPACE/release.keystore

      - name: Build Release APK
        if: >
          github.event.action == 'build-release' ||
          github.event.inputs.build_type == 'release'
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Release APK
        if: >
          github.event.action == 'build-release' ||
          github.event.inputs.build_type == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
